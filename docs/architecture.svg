<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Oil Production Analytics</title><desc id="desc">Separación entre entrenamiento offline, analítica e inferencia online.</desc>
  <defs><style>.box{rx:14;stroke-width:2}.t{font:700 18px sans-serif;fill:#102a43}.s{font:14px sans-serif;fill:#334e68}.h{font:700 22px sans-serif;fill:#fff}.arrow{stroke:#627d98;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#627d98"/></marker></defs>
  <rect width="1100" height="420" fill="#f5f8fa"/><rect x="25" y="20" width="680" height="55" rx="12" fill="#0b7285"/><text x="365" y="55" text-anchor="middle" class="h">ENTRENAMIENTO OFFLINE Y ANALÍTICA</text><rect x="755" y="20" width="320" height="55" rx="12" fill="#2f9e44"/><text x="915" y="55" text-anchor="middle" class="h">INFERENCIA ONLINE</text>
  <g><rect class="box" x="25" y="120" width="180" height="100" fill="#e3fafc" stroke="#0b7285"/><text x="115" y="155" text-anchor="middle" class="t">Datos públicos</text><text x="115" y="182" text-anchor="middle" class="s">CSV mensual</text><text x="115" y="202" text-anchor="middle" class="s">Argentina</text></g><g><rect class="box" x="260" y="105" width="205" height="130" fill="#e3fafc" stroke="#0b7285"/><text x="362" y="140" text-anchor="middle" class="t">src/train.py</text><text x="362" y="168" text-anchor="middle" class="s">fecha + lag consecutivo</text><text x="362" y="190" text-anchor="middle" class="s">holdout temporal</text><text x="362" y="212" text-anchor="middle" class="s">comparación y métricas</text></g>
  <g><rect class="box" x="520" y="95" width="185" height="80" fill="#e3fafc" stroke="#0b7285"/><text x="612" y="130" text-anchor="middle" class="t">Modelo joblib</text><text x="612" y="154" text-anchor="middle" class="s">pipeline + intervalos</text></g><g><rect class="box" x="520" y="205" width="185" height="100" fill="#fff3bf" stroke="#f08c00"/><text x="612" y="240" text-anchor="middle" class="t">Reportes</text><text x="612" y="266" text-anchor="middle" class="s">métricas · drift · SHAP</text><text x="612" y="288" text-anchor="middle" class="s">gráficos · predicciones</text></g>
  <g><rect class="box" x="25" y="285" width="180" height="90" fill="#fff3bf" stroke="#f08c00"/><text x="115" y="320" text-anchor="middle" class="t">SQLite / SQL</text><text x="115" y="347" text-anchor="middle" class="s">vistas analíticas</text></g><g><rect class="box" x="260" y="285" width="205" height="90" fill="#fff3bf" stroke="#f08c00"/><text x="362" y="320" text-anchor="middle" class="t">Power BI</text><text x="362" y="347" text-anchor="middle" class="s">dashboard</text></g>
