name: CI

on:
  push:
    branches: [main, master, work]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Audit published metrics against notebook outputs
        run: python scripts/audit_published_metrics.py
      - name: Run tests
        run: python -m pytest -q
